{% extends "base.html" %}
{% block title %}{{ accion }} sala | Sistema de Salas{% endblock %}

{% block hero_title %}
  <h1 class="hero-title mb-1">{{ accion }} sala</h1>
{% endblock %}

{% block content %}
  <div class="col-md-6">
    {% if accion == 'Crear' %}
      <form method="post" action="{{ url_for('salas_nueva') }}">
    {% else %}
      <form method="post" action="{{ url_for('salas_editar', edificio=sala.edificio, nombre_sala=sala.nombre_sala) }}">
    {% endif %}

      <div class="mb-3">
        <label class="form-label" for="nombre_sala">Nombre de la sala</label>
        <input id="nombre_sala" name="nombre_sala" class="form-control" type="text" value="{{ sala.nombre_sala if sala else '' }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="edificio">Edificio</label>
        <select id="edificio" name="edificio" class="form-select" required>
          <option value="">Seleccione...</option>
          {% for e in edificios %}
            <option value="{{ e }}" {{ 'selected' if sala and sala.edificio==e else '' }}>{{ e }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label" for="capacidad">Capacidad</label>
        <input id="capacidad" name="capacidad" class="form-control" type="number" min="0" value="{{ sala.capacidad if sala else '' }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="tipo_sala">Tipo de sala</label>
        <input id="tipo_sala" name="tipo_sala" class="form-control" type="text" value="{{ sala.tipo_sala if sala else '' }}" required>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ accion }}</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('salas_listado') }}">Cancelar</a>
      </div>
    </form>
  </div>
{% endblock %}
