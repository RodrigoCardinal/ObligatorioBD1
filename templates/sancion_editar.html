{% extends "base.html" %}
{% block title %}Editar sanción | Sistema de Salas{% endblock %}

{% block hero_title %}
  <h1 class="hero-title mb-1">Editar sanción</h1>
  <p class="hero-sub mb-0">Modificar fechas de la sanción</p>
{% endblock %}

{% block content %}
<div class="card p-4" style="max-width:720px;margin:0 auto;">
  <form method="POST" action="{{ url_for('sanciones_editar', ci=s.ci) }}">
    <div class="mb-3">
      <label class="form-label">CI</label>
      <input class="form-control" type="text" value="{{ s.ci }}" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label" for="fecha_inicio">Desde</label>
      <input id="fecha_inicio" name="fecha_inicio" type="date" class="form-control"
             value="{{ s.fecha_inicio.strftime('%Y-%m-%d') if s.fecha_inicio is not none else '' }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="fecha_fin">Hasta</label>
      <input id="fecha_fin" name="fecha_fin" type="date" class="form-control"
             value="{{ s.fecha_fin.strftime('%Y-%m-%d') if s.fecha_fin is not none else '' }}" required>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar cambios</button>
      <a href="{{ url_for('sanciones_listado') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
